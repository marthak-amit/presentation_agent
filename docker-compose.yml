# Optional. `make dev` is the primary way to run. Untested in the build sandbox (no docker).
services:
  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    env_file: [.env]
    environment:
      DATA_DIR: /data
    volumes:
      - ./backend/data:/data
    ports: ["8000:8000"]
  frontend:
    build: { context: frontend }
    depends_on: [backend]
    ports: ["5173:5173"]
